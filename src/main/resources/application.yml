server:
  port: 8081

spring:
  datasource:
    url: jdbc:mysql://localhost:3308/warehouse_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: root
  jpa:
    hibernate:
      ddl-auto: validate      # schema.sql is the source of truth, not Hibernate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql

app:
  jwt:
    secret: change-me-to-a-long-random-base64-string-at-least-32-bytes-long
    expiration-ms: 86400000

  fulfillment:
    locking-strategy: PESSIMISTIC   # or PESSIMISTIC — re-run the test after flipping
    max-retries: 5
    retry-backoff-ms: 20
