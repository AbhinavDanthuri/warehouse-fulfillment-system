services:
  mysql:
    image: mysql:8.0
    container_name: wf-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: warehouse_db
    ports:
      - "3308:3306"          # 3306 = your local MySQL, 3307 = FinFlow's container
    volumes:
      - wf-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  wf-mysql-data:
